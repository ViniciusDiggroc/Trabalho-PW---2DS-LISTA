<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Fornecedores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Logo-->
            <a class="navbar-brand" href="index.html">Sistema</a>
            <!-- Botão hambúrguer (mobile) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Menu -->
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="clientes.html">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="categoria.html">Categorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="fornecedores.html">Fornecedores</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3>Cadastro dos fornecedores</h3>
        <input type="text" id="nome" class="form-control mb-2" placeholder="Nome">
        <input type="text" id="email" class="form-control mb-2" placeholder="Email">
        <input type="text" id="cnpj" class="form-control mb-2" placeholder="CNPJ">
        <label class="form-label mt-2">Estado:</label>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="estado" id="sp" value="SP">
            <label class="form-check-label" for="sp">São Paulo (SP)</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="estado" id="rj" value="RJ">
            <label class="form-check-label" for="rj">Rio de Janeiro (RJ)</label>
        </div>

        <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="estado" id="mg" value="MG">
            <label class="form-check-label" for="mg">Minas Gerais (MG)
            </label>
        </div>
        <button id="salvar" class="btn btn-primary">Salvar</button>
        <table class="table mt-3 table-bordered table-striped table-hover table-sm">
            <tbody id="lista"></tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/fornecedor.js"></script>
</body>

</html>
